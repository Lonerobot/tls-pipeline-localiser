[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-pipeline-localiser"
version = "0.1.7"
description = "Resolve, localise and expose versioned pipeline releases for DCC hosts."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tray = ["PySide6>=6.6"]  # only the tray app needs it; the core stays stdlib-only

[project.gui-scripts]
theline-pipeline = "localiser_tray.app:main"

[tool.setuptools.packages.find]
where = ["src"]
